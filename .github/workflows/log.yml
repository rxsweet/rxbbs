name: log

on:
  workflow_dispatch:   # 手动触发
  schedule:
    - cron: '0 0 1 * *'   # 每月1号 UTC 00:00（即 HKT 08:00）

jobs:
  append-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure log.txt exists
        run: touch log.txt

      - name: Append timestamp to log.txt
        env:
          TZ: 'Asia/Hong_Kong'   # 强制使用香港时间
        run: |
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S %Z')
          echo "[$TIMESTAMP] 月报日志：每月1号自动追加" >> log.txt
          cat log.txt   # （可选）打印确认

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log.txt
          git commit -m "Append monthly log on $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
