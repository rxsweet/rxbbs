name: update_to_serv00_ssh

# 触发条件
on:
  workflow_dispatch:      # 手动触发（也可以改成 push）
  repository_dispatch:
    types: [update-ftp]
  push:
    branches:
      - main
    paths:
      - size.txt
  #workflow_run:
    #workflows: ["serv00_ssh_bakup"]
    #types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload bbs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERV00_SSH_HOST }}
          username: ${{ secrets.SERV00_SSH_USER }}
          key: ${{ secrets.SERV00_SSH_KEY }}
          port: 22
          #上传到目录下的 bbs 目录（相对路径）
          source: "bbs/"
          target: "domains/${{ secrets.SERV00_SSH_HOST }}/public_html/"
