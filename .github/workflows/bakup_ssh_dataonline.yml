name: bakup_ssh_dataonline

# 只有当数据库或压缩包大小变化时才真正备份并提交
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # GitHub 时间，每天 UTC 10:00 → 北京时间 18:00

permissions: write-all

jobs:
  backup-bbs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5    # 已升级到 v5，解决 Node.js 20 警告
      with:
        ref: main
        fetch-depth: 0

    - name: 设置时区为中国时间
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: 从 dataonline 备份 bbs 数据
      env:
        SSH_PRIVATE_KEY: ${{ secrets.DATAONLINE_SSH_KEY }}
        DATAONLINE_USER: ${{ secrets.DATAONLINE_SSH_USER }}
        DATAONLINE_HOST: ${{ secrets.DATAONLINE_SSH_HOST }}
        DATAONLINE_DOMAIN: ${{ secrets.DATAONLINE_SSH_DOMAIN }}
      run: |
        set -euo pipefail
        echo "=== 开始 SSH/SCP 备份 (兼容新版 OpenSSH) ==="

        # SSH 配置
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $DATAONLINE_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

        # 使用完整路径（避免 ~ 解析问题）
        REMOTE_PATH="/home/${DATAONLINE_USER}/domains/${DATAONLINE_DOMAIN}/public_html"
        echo "远程路径: $REMOTE_PATH"

        # 测试 SSH 连接
        echo "测试 SSH 连接..."
        ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
            ${DATAONLINE_USER}@${DATAONLINE_HOST} "echo '✅ SSH 连接成功'" || {
          echo "❌ SSH 连接失败，请检查密钥或主机配置"
          exit 1
        }

        # 创建压缩包
        echo "正在远程创建压缩包..."
        ssh ${DATAONLINE_USER}@${DATAONLINE_HOST} "
          set -e
          cd \"$REMOTE_PATH\" || { echo '❌ 远程目录不存在'; exit 1; }
          [ -d bbs ] || { echo '❌ bbs 目录不存在'; exit 1; }
          rm -f rxbbs.tar.gz
          tar -czf rxbbs.tar.gz bbs/
          echo '✅ 远程压缩完成，大小: '$(stat -c%s rxbbs.tar.gz)' bytes'
        "

        # 下载文件（关键修复：添加 -O 兼容新 OpenSSH）
        echo "正在下载 rxbbs.tar.gz ..."
        scp -O -o StrictHostKeyChecking=no \
            ${DATAONLINE_USER}@${DATAONLINE_HOST}:"$REMOTE_PATH/rxbbs.tar.gz" ./

        # 远程清理
        echo "远程清理临时文件..."
        ssh ${DATAONLINE_USER}@${DATAONLINE_HOST} "rm -f \"$REMOTE_PATH/rxbbs.tar.gz\""

        echo "✅ 备份下载完成"
        ls -lh rxbbs.tar.gz

    - name: 计算大小并判断是否需要提交（核心逻辑）
      env:
        GIT_AUTHOR_NAME: GitHub Action
        GIT_AUTHOR_EMAIL: action@github.com
      run: |
        set -euo pipefail
        
        # 解压到临时目录 bbs
        rm -rf bbs
        mkdir -p bbs
        tar -xzf rxbbs.tar.gz -C bbs --strip-components=1

        # 计算大小
        db_size=$(stat -c%s "bbs/rxdb/rx.db" 2>/dev/null || echo "0")
        tar_size=$(stat -c%s "rxbbs.tar.gz")

        # 生成新的 size 记录
        cat > tamp.txt << EOF
        bbs/rxdb/rx.db: ${db_size} bytes
        rxbbs.tar.gz: ${tar_size} bytes
        EOF

        # 判断是否需要提交
        if [ ! -f "size.txt" ] || ! cmp -s "tamp.txt" "size.txt"; then
          echo "检测到数据库或压缩包大小发生变化，准备提交备份..."
          
          cp tamp.txt size.txt
          
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          
          git add -f rxbbs.tar.gz
          git add -f bbs/rxdb/ bbs/files/ bbs/images/
          git add size.txt
          
          git commit -m "backup: $(date '+%Y-%m-%d %H:%M:%S') rx.db and rxbbs.tar.gz"
          echo "NEED_PUSH=true" >> $GITHUB_ENV
        else
          echo "数据库和压缩包大小未变化，跳过提交"
          echo "NEED_PUSH=false" >> $GITHUB_ENV
        fi

    - name: Push 到 main 分支（仅在需要时执行）
      if: env.NEED_PUSH == 'true'
      run: |
        git push origin main
        echo "✅ 已成功推送到 main 分支"

    - name: 触发 FTP 上传工作流（仅在提交时）
      if: env.NEED_PUSH == 'true'
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.CHU_FA_ACTIONS_GONG_ZUO_LIU_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{
            "event_type": "bbs-upload",
            "client_payload": {
              "triggered_by": "bakup_ssh_dataonline",
              "reason": "size.txt updated and backup committed"
            }
          }'
