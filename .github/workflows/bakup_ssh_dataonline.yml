name: bakup_ssh_dataonline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # 每天北京时间 18:00

permissions: write-all

jobs:
  backup-bbs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0

    - name: 设置时区为中国时间
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: 从 DataOnline FTP 备份 bbs 数据
      env:
        FTP_HOST: ${{ secrets.DATAONLINE_FTP_HOST }}
        FTP_USER: ${{ secrets.DATAONLINE_FTP_USER }}
        FTP_PASS: ${{ secrets.DATAONLINE_FTP_PASS }}
        DOMAIN: ${{ secrets.DATAONLINE_DOMAIN }}
      run: |
        set -euo pipefail
        echo "=== 开始 FTP 备份 (仅3个文件夹) ==="
    
        sudo apt-get update -qq && sudo apt-get install -y lftp sqlite3
    
        REMOTE_PATH="domains/${DOMAIN}/public_html"
    
        # 下载三个文件夹
        lftp -u "${FTP_USER},${FTP_PASS}" ${FTP_HOST} << EOF
          set ssl:verify-certificate no
          cd ${REMOTE_PATH}
          mirror --verbose --parallel=3 --delete bbs/rxdb   ./bbs/rxdb
          mirror --verbose --parallel=3 --delete bbs/files  ./bbs/files
          mirror --verbose --parallel=3 --delete bbs/images ./bbs/images
          quit
        EOF
    
        echo "✅ FTP 下载完成"
    
        # 关键修复：检查并尝试修复 SQLite 数据库
        echo "正在检查 rx.db 完整性..."
        if [ -f "bbs/rxdb/rx.db" ]; then
          db_size=$(stat -c%s "bbs/rxdb/rx.db")
          echo "rx.db 大小: ${db_size} bytes"
    
          # 测试数据库
          if sqlite3 "bbs/rxdb/rx.db" "PRAGMA integrity_check;" > /dev/null 2>&1; then
            echo "✅ rx.db 完整性检查通过"
          else
            echo "⚠️ 数据库损坏，尝试修复..."
            # 尝试导出+重建（最有效修复方法）
            sqlite3 "bbs/rxdb/rx.db" ".dump" > rxdb_dump.sql 2>/dev/null || true
            if [ -s rxdb_dump.sql ]; then
              mv "bbs/rxdb/rx.db" "bbs/rxdb/rx.db.bak"
              sqlite3 "bbs/rxdb/rx.db" < rxdb_dump.sql
              echo "✅ 已尝试自动修复数据库"
            else
              echo "❌ 无法修复数据库，可能下载不完整"
            fi
          fi
        else
          echo "❌ 未找到 rx.db 文件"
        fi
    
        # 打包
        echo "正在创建 rxbbs.tar.gz ..."
        tar -czf rxbbs.tar.gz bbs/
    
        echo "压缩包大小: $(stat -c%s rxbbs.tar.gz) bytes"

    - name: 计算大小并判断是否需要提交
      env:
        GIT_AUTHOR_NAME: GitHub Action
        GIT_AUTHOR_EMAIL: action@github.com
      run: |
        set -euo pipefail

        db_size=$(stat -c%s "bbs/rxdb/rx.db" 2>/dev/null || echo "0")
        tar_size=$(stat -c%s "rxbbs.tar.gz")

        cat > tamp.txt << EOF
        bbs/rxdb/rx.db: ${db_size} bytes
        rxbbs.tar.gz: ${tar_size} bytes
        EOF

        if [ ! -f "size.txt" ] || ! cmp -s "tamp.txt" "size.txt"; then
          echo "检测到数据变化，准备提交..."
          
          cp tamp.txt size.txt
          
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          
          git add -f rxbbs.tar.gz
          git add -f bbs/rxdb/ bbs/files/ bbs/images/ 2>/dev/null || true
          git add size.txt
          
          git commit -m "backup: $(date '+%Y-%m-%d %H:%M:%S') rx.db + files + images"
          echo "NEED_PUSH=true" >> $GITHUB_ENV
        else
          echo "数据未变化，跳过提交"
          echo "NEED_PUSH=false" >> $GITHUB_ENV
        fi

    - name: Push 到 main 分支
      if: env.NEED_PUSH == 'true'
      run: |
        git push origin main
        echo "✅ 已推送到 main 分支"

    - name: 触发 FTP 上传工作流
      if: env.NEED_PUSH == 'true'
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.CHU_FA_ACTIONS_GONG_ZUO_LIU_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{
            "event_type": "bbs-upload",
            "client_payload": {
              "triggered_by": "bakup_ssh_dataonline",
              "reason": "size.txt updated"
            }
          }'
