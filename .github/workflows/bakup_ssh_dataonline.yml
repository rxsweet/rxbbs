name: bakup_ssh_dataonline
#因serv00服务器有点慢，暂时先用dataonline，如dataonline空间不能用了，再换回serv00
on:
  workflow_dispatch:
  schedule:
   - cron: '0 10 * * *'
  #实际时间：+ 8小时  = 18:00
  #这个实际每天18:00执行
  #表达式生成  https://crontab.guru/
permissions: write-all

jobs:
  backup-serv00:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: 设置时区
      run: sudo timedatectl set-timezone 'Asia/Shanghai' 
    - name: Backup from Serv00
      env:
        SSH_PRIVATE_KEY: ${{ secrets.DATAONLINE_SSH_KEY }}
        DATAONLINE_USER: ${{ secrets.DATAONLINE_SSH_USER }}
        DATAONLINE_HOST: ${{ secrets.DATAONLINE_SSH_HOST }}
        DATAONLINE_DOMAIN: ${{ secrets.DATAONLINE_SSH_DOMAIN }}
      run: |
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $DATAONLINE_HOST >> ~/.ssh/known_hosts
        
        #bbs的文件路径
        path="~/domains/${DATAONLINE_DOMAIN}/public_html"
        echo "使用路径: $path"
        # 创建压缩文件
        ssh ${DATAONLINE_USER}@${DATAONLINE_HOST} "cd $path && tar -czf rxbbs.tar.gz bbs/"
        # 下载
        scp ${DATAONLINE_USER}@${DATAONLINE_HOST}:"$path/rxbbs.tar.gz" ./
        # 清理
        ssh ${DATAONLINE_USER}@${DATAONLINE_HOST} "rm $path/rxbbs.tar.gz"


    - name: Extract, compute size, and commit changes
      env:
        GIT_AUTHOR_NAME: GitHub Action
        GIT_AUTHOR_EMAIL: action@github.com
      run: |
        set -euo pipefail
        # ---------- 1. 解压 ----------
        mkdir -p bbs
        if [ ! -f "rxbbs.tar.gz" ]; then
          echo "错误：未能找到或下载压缩文件 rxbbs.tar.gz"
          exit 1
        fi
        tar -xzf rxbbs.tar.gz -C bbs --strip-components=1
        # ---------- 2. 生成 tamp.txt ----------
        if [ ! -f "bbs/rxdb/rx.db" ]; then
          echo "Error: bbs/rxdb/rx.db not found!" >&2
          exit 1
        fi
        db_size=$(stat -c%s "bbs/rxdb/rx.db")
        echo "bbs/rxdb/rx.db: ${db_size} bytes" > tamp.txt
        echo "tamp.txt 已生成："
        cat tamp.txt
        # ---------- 3. 配置 Git ----------
        git config --local user.name  "$GIT_AUTHOR_NAME"
        git config --local user.email "$GIT_AUTHOR_EMAIL"
        # ---------- 4. 始终添加核心文件 ----------
        git add ./rxbbs.tar.gz
        git add ./bbs/rxdb/ ./bbs/files/ ./bbs/images/ ./bbs/styles/
        # ---------- 5. 处理 size.txt ----------
        commit_needed=false
        if [ ! -f "size.txt" ]; then
          cp tamp.txt size.txt
          git add size.txt
          git commit -m "init: create size.txt with rx.db size"
          commit_needed=true
          echo "size.txt 已创建"
        elif ! cmp -s "tamp.txt" "size.txt"; then
          cp tamp.txt size.txt
          git add size.txt
          git commit -m "chore: update rx.db size $(date -u '+%Y-%m-%d %H:%M UTC')"
          commit_needed=true
          echo "size.txt 已更新"
        else
          echo "rx.db 大小未变化，size.txt 无需更新"
        fi
        # ---------- 6. 提交备份（即使 size.txt 未变，也要提交压缩包等） ----------
        if [ "$commit_needed" = false ]; then
          # 检查是否有其他文件变更（比如压缩包更新了）
          if git status --porcelain | grep -q .; then
            git commit -m "$(date '+%Y-%m-%d %H:%M:%S') Backup"
            echo "已提交备份文件变更"
          else
            echo "无任何文件变更，跳过 commit"
          fi
        fi
    - name: Push all changes to repository
      run: |
        git push origin HEAD:main
        echo "所有变更已推送到 main 分支"
