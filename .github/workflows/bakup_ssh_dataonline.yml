name: bakup_ssh_dataonline
#因serv00服务器有点慢，暂时先用dataonline，如dataonline空间不能用了，再换回serv00
on:
  workflow_dispatch:
  schedule:
   - cron: '0 10 * * *'
  #实际时间：+ 8小时  = 18:00
  #这个实际每天18:00执行
  #表达式生成  https://crontab.guru/
permissions: write-all

jobs:
  backup-bbs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main   # 关键！强制 checkout main 分支
        fetch-depth: 0  # 推荐：完整历史，便于 push
    - name: 设置时区
      run: sudo timedatectl set-timezone 'Asia/Shanghai' 
    - name: Backup from bbs
      env:
        SSH_PRIVATE_KEY: ${{ secrets.DATAONLINE_SSH_KEY }}
        DATAONLINE_USER: ${{ secrets.DATAONLINE_SSH_USER }}
        DATAONLINE_HOST: ${{ secrets.DATAONLINE_SSH_HOST }}
        DATAONLINE_DOMAIN: ${{ secrets.DATAONLINE_SSH_DOMAIN }}
      run: |
        # 设置SSH
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $DATAONLINE_HOST >> ~/.ssh/known_hosts
        
        #bbs的文件路径
        path="~/domains/${DATAONLINE_DOMAIN}/public_html"
        echo "使用路径: $path"
        # 创建压缩文件
        ssh ${DATAONLINE_USER}@${DATAONLINE_HOST} "cd $path && tar -czf rxbbs.tar.gz bbs/"
        # 下载
        scp ${DATAONLINE_USER}@${DATAONLINE_HOST}:"$path/rxbbs.tar.gz" ./
        # 清理
        ssh ${DATAONLINE_USER}@${DATAONLINE_HOST} "rm $path/rxbbs.tar.gz"

    - name: Extract, compute size, and commit changes
      env:
        GIT_AUTHOR_NAME: GitHub Action
        GIT_AUTHOR_EMAIL: action@github.com
      run: |
        set -euo pipefail
        # 1. 解压
        mkdir -p bbs
        if [ ! -f "rxbbs.tar.gz" ]; then
          echo "错误：rxbbs.tar.gz 不存在"
          exit 1
        fi
        tar -xzf rxbbs.tar.gz -C bbs --strip-components=1
        # 2. 生成 tamp.txt
        db_size=$(stat -c%s "bbs/rxdb/rx.db")
        tar_size=$(stat -c%s "rxbbs.tar.gz")
        {
          echo "bbs/rxdb/rx.db: ${db_size} bytes"
          echo "rxbbs.tar.gz: ${tar_size} bytes"
        } > tamp.txt
        echo "tamp.txt 已生成："
        cat tamp.txt
        # 3. Git 配置
        git config --local user.name "$GIT_AUTHOR_NAME"
        git config --local user.email "$GIT_AUTHOR_EMAIL"
        # 4. 强制添加所有文件
        git add -f ./rxbbs.tar.gz
        git add -f ./bbs/rxdb/ ./bbs/files/ ./bbs/images/ ./bbs/styles/
        # 5. 处理 size.txt（只 add，不 commit）
        if [ ! -f "size.txt" ]; then
          cp tamp.txt size.txt
          git add size.txt
          COMMIT_MSG="init: create size.txt with rx.db size"
        elif ! cmp -s "tamp.txt" "size.txt"; then
          cp tamp.txt size.txt
          git add size.txt
          COMMIT_MSG="chore: update rx.db size $(date -u '+%Y-%m-%d %H:%M UTC')"
        else
          COMMIT_MSG="backup: $(date '+%Y-%m-%d %H:%M:%S') Backup"
        fi
        # 6. 统一判断是否有任何变更 → 只提交一次
        if git diff --cached --quiet; then
          echo "无任何文件变更，跳过提交"
          exit 0
        else
          git commit -m "$COMMIT_MSG"
          echo "已提交：$COMMIT_MSG"
        fi
    - name: Push to main
      run: |
        git push origin main
        echo "已推送到远程 main 分支"
