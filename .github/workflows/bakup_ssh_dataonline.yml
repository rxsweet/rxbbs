name: bakup_ssh_dataonline
# 只有当数据库或压缩包大小变化时才真正备份并提交

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'  # GitHub 时间，每天 UTC 10:00 → 北京时间 18:00

permissions: write-all

jobs:
  backup-bbs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: 设置时区为中国时间
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: 从 dataonline 备份 bbs 数据
      env:
        SSH_PRIVATE_KEY: ${{ secrets.DATAONLINE_SSH_KEY }}
        DATAONLINE_USER: ${{ secrets.DATAONLINE_SSH_USER }}
        DATAONLINE_HOST: ${{ secrets.DATAONLINE_SSH_HOST }}
        DATAONLINE_DOMAIN: ${{ secrets.DATAONLINE_SSH_DOMAIN }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $DATAONLINE_HOST >> ~/.ssh/known_hosts 2>/dev/null

        path="~/domains/${DATAONLINE_DOMAIN}/public_html"
        echo "远程路径: $path"

        # 创建压缩包
        ssh ${DATAONLINE_USER}@${DATAONLINE_HOST} "cd $path && tar -czf rxbbs.tar.gz bbs/"
        # 下载
        scp ${DATAONLINE_USER}@${DATAONLINE_HOST}:"$path/rxbbs.tar.gz" ./
        # 远程清理
        ssh ${DATAONLINE_USER}@${DATAONLINE_HOST} "rm $path/rxbbs.tar.gz"

    - name: 计算大小并判断是否需要提交（核心逻辑）
      env:
        GIT_AUTHOR_NAME: GitHub Action
        GIT_AUTHOR_EMAIL: action@github.com
      run: |
        set -euo pipefail

        # 解压到临时目录 bbs（覆盖式）
        rm -rf bbs
        mkdir -p bbs
        tar -xzf rxbbs.tar.gz -C bbs --strip-components=1

        # 计算关键文件大小
        db_size=$(stat -c%s "bbs/rxdb/rx.db")
        tar_size=$(stat -c%s "rxbbs.tar.gz")

        # 生成新的 tamp.txt
        cat > tamp.txt << EOF
        bbs/rxdb/rx.db: ${db_size} bytes
        rxbbs.tar.gz: ${tar_size} bytes
        EOF

        # 关键判断：只有当 size.txt 不存在 或 内容不同时才提交
        if [ ! -f "size.txt" ] || ! cmp -s "tamp.txt" "size.txt"; then
          echo "检测到数据库或压缩包大小发生变化，准备提交备份..."

          # 更新 size.txt
          cp tamp.txt size.txt

          # Git 配置
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          # 强制添加需要备份的所有文件
          git add -f rxbbs.tar.gz
          git add -f bbs/rxdb/ bbs/files/ bbs/images/ bbs/styles/
          git add size.txt

          # 提交（包含所有变更）
          git commit -m "backup: $(date '+%Y-%m-%d %H:%M:%S') rx.db and rxbbs.tar.gz"

          echo "已提交新备份（因 size.txt 变化）"
          echo "NEED_PUSH=true" >> $GITHUB_ENV
        else
          echo "数据库和压缩包大小均未变化（size.txt 无变化），跳过提交"
          echo "NEED_PUSH=false" >> $GITHUB_ENV
        fi

    - name: Push 到 main 分支（仅在需要时执行）
      if: env.NEED_PUSH == 'true'
      run: |
        git push origin main
        echo "已成功推送到 main 分支"

    # 可选：变化时触发 FTP 上传工作流（你原来有的功能保留）
    - name: 触发 FTP 上传工作流（仅在提交时）
      if: env.NEED_PUSH == 'true'
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.CHU_FA_ACTIONS_GONG_ZUO_LIU_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{
            "event_type": "bbs-upload",
            "client_payload": { 
              "triggered_by": "bakup_ssh_dataonline", 
              "reason": "size.txt updated and backup committed" 
            }
          }'
