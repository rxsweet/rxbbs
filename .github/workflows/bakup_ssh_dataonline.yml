name: bakup_ssh_dataonline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # 每天北京时间 18:00

permissions: write-all

jobs:
  backup-bbs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0

    - name: 设置时区为中国时间
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: 从 DataOnline FTP 备份 bbs 数据
      env:
        FTP_HOST: "ftp.1985.us.ci"
        FTP_USER: "rxsweeto"
        FTP_PASS: "P93qvEaW"
        DOMAIN: "1985.us.ci"          # ← 新增：你的域名
      run: |
        set -euo pipefail
        echo "=== 开始 FTP 备份 ==="

        # 安装 lftp
        sudo apt-get update -qq && sudo apt-get install -y lftp

        REMOTE_PATH="domains/${DOMAIN}/public_html"

        echo "远程路径: ${REMOTE_PATH}"

        # 使用 lftp 下载整个 bbs 目录
        lftp -u "${FTP_USER},${FTP_PASS}" ${FTP_HOST} << EOF
          set ssl:verify-certificate no
          set mirror:use-pget-n 5
          cd ${REMOTE_PATH}
          mirror --verbose --parallel=5 --delete bbs ./bbs
          quit
        EOF

        echo "✅ FTP 下载完成"
        ls -lh bbs/ 2>/dev/null || echo "bbs 目录为空"

        # 本地打包
        echo "正在创建压缩包 rxbbs.tar.gz ..."
        tar -czf rxbbs.tar.gz bbs/

        echo "压缩包大小: $(stat -c%s rxbbs.tar.gz) bytes"

    - name: 计算大小并判断是否需要提交
      env:
        GIT_AUTHOR_NAME: GitHub Action
        GIT_AUTHOR_EMAIL: action@github.com
      run: |
        set -euo pipefail

        db_size=$(stat -c%s "bbs/rxdb/rx.db" 2>/dev/null || echo "0")
        tar_size=$(stat -c%s "rxbbs.tar.gz")

        cat > tamp.txt << EOF
        bbs/rxdb/rx.db: ${db_size} bytes
        rxbbs.tar.gz: ${tar_size} bytes
        EOF

        if [ ! -f "size.txt" ] || ! cmp -s "tamp.txt" "size.txt"; then
          echo "检测到数据变化，准备提交..."
          
          cp tamp.txt size.txt
          
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          
          git add -f rxbbs.tar.gz
          git add -f bbs/rxdb/ bbs/files/ bbs/images/ 2>/dev/null || true
          git add size.txt
          
          git commit -m "backup: $(date '+%Y-%m-%d %H:%M:%S') rx.db + rxbbs.tar.gz"
          echo "NEED_PUSH=true" >> $GITHUB_ENV
        else
          echo "数据未变化，跳过提交"
          echo "NEED_PUSH=false" >> $GITHUB_ENV
        fi

    - name: Push 到 main 分支
      if: env.NEED_PUSH == 'true'
      run: |
        git push origin main
        echo "✅ 已推送到 main 分支"

    - name: 触发 FTP 上传工作流
      if: env.NEED_PUSH == 'true'
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.CHU_FA_ACTIONS_GONG_ZUO_LIU_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{
            "event_type": "bbs-upload",
            "client_payload": {
              "triggered_by": "bakup_ssh_dataonline",
              "reason": "size.txt updated"
            }
          }'
