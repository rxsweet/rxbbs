name: record_file_sizes

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["serv00_ssh_bakup"]
    types: [completed]

permissions: write-all

jobs:
  get-file-sizes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate tamp.txt with rx.db size only
        run: |
          # 检查 rx.db 是否存在
          if [ ! -f "bbs/rxdb/rx.db" ]; then
            echo "Error: bbs/rxdb/rx.db not found!" >&2
            exit 1
          fi

          # 获取 rx.db 大小（字节）
          db_size=$(stat -c%s "bbs/rxdb/rx.db")

          # 写入 tamp.txt（只保留 rx.db）
          {
            echo "bbs/rxdb/rx.db: ${db_size} bytes"
          } > tamp.txt

          echo "tamp.txt 已生成："
          cat tamp.txt

      - name: Update size.txt if changed
        env:
          GIT_AUTHOR_NAME: GitHub Action
          GIT_AUTHOR_EMAIL: action@github.com
        run: |
          # 首次运行：创建 size.txt
          if [ ! -f "size.txt" ]; then
            cp tamp.txt size.txt
            git add size.txt
            git -c user.name="$GIT_AUTHOR_NAME" -c user.email="$GIT_AUTHOR_EMAIL" \
                commit -m "init: create size.txt with rx.db size"
            git push origin HEAD:${{ github.ref_name }}
            echo "size.txt 已创建并提交"
            exit 0
          fi

          # 对比 tamp.txt 和 size.txt
          if ! cmp -s "tamp.txt" "size.txt"; then
            echo "rx.db 文件大小发生变化！正在更新 size.txt"
            cp tamp.txt size.txt
            git add size.txt
            git -c user.name="$GIT_AUTHOR_NAME" -c user.email="$GIT_AUTHOR_EMAIL" \
                commit -m "chore: update rx.db size $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:${{ github.ref_name }}
            echo "size.txt 已更新并提交"
          else
            echo "rx.db 文件大小未变化，无需更新"
          fi
