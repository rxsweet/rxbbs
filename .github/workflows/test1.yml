name: test1
on:
  repository_dispatch:
    types: [bbs-upload]
  workflow_dispatch:

jobs:
  upload-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - uses: actions/checkout@v4

      - name: 部署到 Beget FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_PASS }}
          local-dir: ./bbs1/
          server-dir: /bbs1/
          protocol: ftps
          security: loose
