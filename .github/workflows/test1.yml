name: test1
on:
  repository_dispatch:
    types: [bbs-upload]
  workflow_dispatch:

jobs:
  upload-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - uses: actions/checkout@v4

      - name: 部署到 Beget FTPS（最稳）
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5   # 固定一个稳定版本
        with:
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_PASS }}
          local-dir: ./bbs1/               # 注意结尾的斜杠
          server-dir: /bbs1/               # 远程目录
          protocol: ftps                   # 关键！强制 FTPS
          security: loose                  # 接受 Beget 自签名证书
          dangerous-clean-slate: false     # true=删除远端多余文件，false=只上传新增/修改
          log-level: verbose               # 需要看详细日志时打开
