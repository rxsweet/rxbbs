name: update_to_dataonline_ssh

# 触发条件
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["serv00_ssh_bakup"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ secrets.DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify bbs/ exists
        run: |
          if [ ! -d "bbs" ]; then
            echo "ERROR: bbs/ directory not found!"
            exit 1
          fi
          echo "Found bbs/ with $(find bbs -type f | wc -l) files"

      # Step 1: 上传 bbs/ 到远程临时目录
      - name: Upload bbs/ folder
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.DATAONLINE_SSH_HOST }}
          username: ${{ secrets.DATAONLINE_SSH_USER }}
          key: ${{ secrets.DATAONLINE_SSH_KEY }}
          port: 22
          source: "bbs/"
          target: "~/bbs_upload_tmp/"
          overwrite: true
          strip_components: 0

      # Step 2: 在远程服务器执行覆盖部署（不用 rsync）
      - name: Deploy with cp & rm (no rsync needed)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DATAONLINE_SSH_HOST }}
          username: ${{ secrets.DATAONLINE_SSH_USER }}
          key: ${{ secrets.DATAONLINE_SSH_KEY }}
          port: 22
          script: |
            set -e

            TARGET_DIR="domains/${DOMAIN}/public_html/bbs"
            TMP_DIR="~/bbs_upload_tmp/bbs"

            echo "Creating target directory..."
            mkdir -p "$TARGET_DIR"

            echo "Clearing old files in $TARGET_DIR..."
            find "$TARGET_DIR" -mindepth 1 -delete  # 彻底删除所有内容（保留目录本身）

            echo "Copying new files..."
            cp -r "$TMP_DIR"/* "$TARGET_DIR"/

            echo "=== Deploy Success! ==="
            echo "Files in $TARGET_DIR:"
            ls -la "$TARGET_DIR" | head -15

            echo "Cleaning up temporary files..."
            rm -rf ~/bbs_upload_tmp
