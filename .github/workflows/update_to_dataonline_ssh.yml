name: update_to_dataonline_ssh

# 触发条件
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["serv00_ssh_bakup"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ${{ secrets.DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify bbs/ exists
        run: |
          if [ ! -d "bbs" ]; then
            echo "ERROR: bbs/ directory not found!"
            exit 1
          fi
          echo "Found bbs/ with $(find bbs -type f | wc -l) files"

      # Step 1: 上传 bbs/ 到远程临时目录
      - name: Upload bbs/ folder
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.DATAONLINE_SSH_HOST }}
          username: ${{ secrets.DATAONLINE_SSH_USER }}
          key: ${{ secrets.DATAONLINE_SSH_KEY }}
          port: 22
          source: "bbs/"
          target: "~/bbs_upload_tmp/"
          overwrite: true
          strip_components: 0

      # Step 2: 在远程服务器执行 rsync 覆盖部署
      - name: Deploy via rsync (remote)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DATAONLINE_SSH_HOST }}
          username: ${{ secrets.DATAONLINE_SSH_USER }}
          key: ${{ secrets.DATAONLINE_SSH_KEY }}
          port: 22
          script: |
            set -e

            TARGET_DIR="domains/${DOMAIN}/public_html/bbs"
            mkdir -p "$TARGET_DIR"

            echo "Syncing files..."
            rsync -av --delete ~/bbs_upload_tmp/bbs/ "$TARGET_DIR/"

            echo "=== Deploy Success! ==="
            echo "Files in $TARGET_DIR:"
            ls -la "$TARGET_DIR" | head -15

            # 清理临时目录
            rm -rf ~/bbs_upload_tmp
