name: bakup_ftp_Xrea

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

permissions: write-all

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: 📦 Install ncftp
        run: |
          sudo apt-get update
          sudo apt-get install -y ncftp

      - name: 执行任务 -update ftp
        env:
          XREA_HOST: ${{ secrets.XREA_FTP_HOST }}
          XREA_USER: ${{ secrets.XREA_FTP_USER }}
          XREA_PASS: ${{ secrets.XREA_FTP_PASS }}
        run: |
          set -euo pipefail

          ROOT_DIR=$(pwd)

          echo "=== 删除旧文件 ==="
          rm -rf "$ROOT_DIR/bbs"

          echo "=== 创建目录 ==="
          mkdir -p "$ROOT_DIR/bbs/rxdb"
          mkdir -p "$ROOT_DIR/bbs/files"
          mkdir -p "$ROOT_DIR/bbs/images"
          mkdir -p "$ROOT_DIR/bbs/styles"

          echo "=== 下载 rxdb ==="
          cd "$ROOT_DIR/bbs/rxdb"
          ncftpget -R -v \
            ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs/rxdb/ .

          echo "=== 下载 files ==="
          cd "$ROOT_DIR/bbs/files"
          ncftpget -R -v \
            ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs/files/ .

          echo "=== 下载 images ==="
          cd "$ROOT_DIR/bbs/images"
          ncftpget -R -v \
            ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs/images/ .

          echo "=== 下载 styles ==="
          cd "$ROOT_DIR/bbs/styles"
          ncftpget -R -v \
            ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs/styles/ .

          cd "$ROOT_DIR"

          echo "=== 下载完成 ==="
          find ./bbs -type f | head -50 || true


      - name: 检测 rx.db 文件并压缩
        run: |
          set -euo pipefail

          echo "=== 查找 rx.db ==="
          RXDB_PATH=$(find ./bbs -name "rx.db" | head -1)

          if [ -z "$RXDB_PATH" ]; then
            echo "❌ 未找到 rx.db"
            exit 1
          fi

          echo "找到数据库：$RXDB_PATH"

          db_size=$(stat -c%s "$RXDB_PATH")

          if [ "$db_size" -eq 0 ]; then
            echo "❌ rx.db 文件为空"
            exit 1
          fi

          if [ "$db_size" -lt 10240 ]; then
            echo "❌ rx.db 大小异常"
            exit 1
          fi

          echo "✅ rx.db 下载成功"
          echo "rx.db 大小: ${db_size} bytes"

          rm -f rxbbs.tar.gz

          echo "=== 创建压缩包 ==="
          tar -czf rxbbs.tar.gz bbs/

          tar_size=$(stat -c%s rxbbs.tar.gz)

          echo "✅ 打包完成"
          echo "压缩包大小: ${tar_size} bytes"

      - name: 计算大小并判断是否需要提交
        env:
          GIT_AUTHOR_NAME: GitHub Action
          GIT_AUTHOR_EMAIL: action@github.com
        run: |
          set -euo pipefail

          RXDB_PATH=$(find ./bbs -name "rx.db" | head -1)

          db_size=$(stat -c%s "$RXDB_PATH")
          tar_size=$(stat -c%s "rxbbs.tar.gz")

          cat > tamp.txt << EOF
          rx.db: ${db_size} bytes
          rxbbs.tar.gz: ${tar_size} bytes
          EOF

          if [ ! -f "size.txt" ] || ! cmp -s "tamp.txt" "size.txt"; then
            echo "检测到数据变化，准备提交..."

            cp tamp.txt size.txt

            git config user.name "$GIT_AUTHOR_NAME"
            git config user.email "$GIT_AUTHOR_EMAIL"

            git add -f rxbbs.tar.gz
            git add -f bbs/ 2>/dev/null || true
            git add size.txt

            if git diff --cached --quiet; then
              echo "没有实际变更"
              echo "NEED_PUSH=false" >> $GITHUB_ENV
            else
              git commit -m "backup: $(date '+%Y-%m-%d %H:%M:%S')"
              echo "NEED_PUSH=true" >> $GITHUB_ENV
            fi
          else
            echo "数据未变化，跳过提交"
            echo "NEED_PUSH=false" >> $GITHUB_ENV
          fi

      - name: Push 到 main 分支
        if: env.NEED_PUSH == 'true'
        run: |
          git push origin main
          echo "✅ 已推送到 main 分支"

      - name: 触发 FTP 上传工作流
        if: env.NEED_PUSH == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.CHU_FA_ACTIONS_GONG_ZUO_LIU_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{
              "event_type": "bbs-upload",
              "client_payload": {
                "triggered_by": "bakup_ftp_Xrea",
                "reason": "size.txt updated"
              }
            }'
