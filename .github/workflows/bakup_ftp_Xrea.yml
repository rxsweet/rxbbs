name: bakup_ftp_Xrea
# 触发条件
on:
  workflow_dispatch:
  schedule:
   - cron: '0 10 * * *'
  #实际时间：+ 8小时  = 18:00
  #这个实际每天18:00执行
  #表达式生成  https://crontab.guru/

permissions: write-all
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai' 
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: 📦 Install ncftp
        run: sudo apt-get update && sudo apt-get install -y ncftp
      - name: 执行任务 -update ftp
        env:
          XREA_HOST: ${{ secrets.XREA_FTP_HOST }}
          XREA_USER: ${{ secrets.XREA_FTP_USER }}
          XREA_PASS: ${{ secrets.XREA_FTP_PASS }}
        run: |
           mkdir -p ./bbs/rxdb ./bbs/files ./bbs/images ./bbs/styles
           cd ./bbs/rxdb
           #ncftpget -R -T -v ftp://${FREEHOSTIA_USER}:${FREEHOSTIA_PASS}@${FREEHOSTIA_HOST}/bbs/rxdb/ .
           ncftpget -R -T -v ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs/rxdb/ .
           cd ../files
           ncftpget -R -T -v ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs/files/ .
           cd ../images
           ncftpget -R -T -v ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs/images/ .
           cd ../styles
           ncftpget -R -T -v ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs/styles/ .
           #下载ncftpget ncftpget -R -u ${FREEHOSTIA_USER}:${FREEHOSTIA_PASS} ftp://${FREEHOSTIA_HOST}/bbs/rxdb/ ./bbs/rxdb/
           #上传ncftpput -R -u ${FREEHOSTIA_USER} -p ${FREEHOSTIA_PASS} ${FREEHOSTIA_HOST} / ./test/
           #-R是递归上传文件夹
           #-u user
           #-p pass
           #host (不带ftp://)
           #/ 远程目录
           #./test/ 本地目录
      - name: 检测rx.db文件,压缩rxbbs.tar.gz
        run: |
          set -euo pipefail

          echo "=== 检查 rx.db ==="

          if [ ! -f "bbs/rxdb/rx.db" ]; then
            echo "❌ rx.db 下载失败"
            exit 1
          fi

          db_size=$(stat -c%s "bbs/rxdb/rx.db")

          if [ "$db_size" -eq 0 ]; then
            echo "❌ rx.db 文件为空"
            exit 1
          fi

          echo "✅ rx.db 下载成功"
          echo "rx.db 大小: ${db_size} bytes"

          # 可选：防止下载到异常小文件
          if [ "$db_size" -lt 10240 ]; then
            echo "❌ rx.db 大小异常"
            exit 1
          fi

          echo "=== 创建压缩包 ==="

          tar -czf rxbbs.tar.gz bbs/

          tar_size=$(stat -c%s rxbbs.tar.gz)

          echo "✅ 打包完成"
          echo "压缩包大小: ${tar_size} bytes"
        
      - name: 计算大小并判断是否需要提交
        env:
          GIT_AUTHOR_NAME: GitHub Action
          GIT_AUTHOR_EMAIL: action@github.com
        run: |
          set -euo pipefail

          db_size=$(stat -c%s "bbs/rxdb/rx.db" 2>/dev/null || echo "0")
          tar_size=$(stat -c%s "rxbbs.tar.gz")

          cat > tamp.txt << EOF
          bbs/rxdb/rx.db: ${db_size} bytes
          rxbbs.tar.gz: ${tar_size} bytes
          EOF

          if [ ! -f "size.txt" ] || ! cmp -s "tamp.txt" "size.txt"; then
            echo "检测到数据变化，准备提交..."
          
            cp tamp.txt size.txt
          
            git config user.name "$GIT_AUTHOR_NAME"
            git config user.email "$GIT_AUTHOR_EMAIL"
          
            git add -f rxbbs.tar.gz
            git add -f bbs/rxdb/ bbs/files/ bbs/images/ 2>/dev/null || true
            git add size.txt
          
            git commit -m "backup: $(date '+%Y-%m-%d %H:%M:%S') rx.db + files + images"
            echo "NEED_PUSH=true" >> $GITHUB_ENV
          else
            echo "数据未变化，跳过提交"
            echo "NEED_PUSH=false" >> $GITHUB_ENV
          fi

      - name: Push 到 main 分支
        if: env.NEED_PUSH == 'true'
        run: |
          git push origin main
          echo "✅ 已推送到 main 分支"

      - name: 触发 FTP 上传工作流
        if: env.NEED_PUSH == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.CHU_FA_ACTIONS_GONG_ZUO_LIU_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{
              "event_type": "bbs-upload",
              "client_payload": {
                "triggered_by": "bakup_ftp_Xrea",
                "reason": "size.txt updated"
              }
            }'
