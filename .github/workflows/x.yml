name: bakup_Xrea_目录
# 触发条件
on:
  workflow_dispatch:

permissions: write-all
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai' 
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: 📦 Install ncftp
        run: sudo apt-get update && sudo apt-get install -y ncftp
      - name: 执行任务 -update ftp
        env:
          XREA_HOST: ${{ secrets.XREA_FTP_HOST }}
          XREA_USER: ${{ secrets.XREA_FTP_USER }}
          XREA_PASS: ${{ secrets.XREA_FTP_PASS }}
        run: |
           mkdir -p ./bbs1/rxdb ./bbs1/files ./bbs1/images ./bbs1/styles
           cd ./bbs1/rxdb
           #ncftpget -R -T -v ftp://${FREEHOSTIA_USER}:${FREEHOSTIA_PASS}@${FREEHOSTIA_HOST}/bbs1/rxdb/ .
           ncftpget -R -T -v ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs1/rxdb/ .
           cd ../files
           ncftpget -R -T -v ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs1/files/ .
           cd ../images
           ncftpget -R -T -v ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs1/images/ .
           cd ../styles
           ncftpget -R -T -v ftp://${XREA_USER}:${XREA_PASS}@${XREA_HOST}/public_html/bbs1/styles/ .
           #下载ncftpget ncftpget -R -u ${FREEHOSTIA_USER}:${FREEHOSTIA_PASS} ftp://${FREEHOSTIA_HOST}/bbs1/rxdb/ ./bbs1/rxdb/
           #上传ncftpput -R -u ${FREEHOSTIA_USER} -p ${FREEHOSTIA_PASS} ${FREEHOSTIA_HOST} / ./test/
           #-R是递归上传文件夹
           #-u user
           #-p pass
           #host (不带ftp://)
           #/ 远程目录
           #./test/ 本地目录
      - name: Commit
        id: commit
        continue-on-error: true
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add ./
          git commit -m "$(date '+%Y-%m-%d %H:%M:%S') update bbs1 done"
          git pull --rebase
      - name: 推送更改
        uses:  ad-m/github-push-action@master
        with:
          branch: main
